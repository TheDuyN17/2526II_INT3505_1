apiVersion: apps/v1
kind: Deployment
metadata:
  name: lecture-10-api
  namespace: lecture-10
  labels:
    app: lecture-10-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lecture-10-api
  template:
    metadata:
      labels:
        app: lecture-10-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "5010"
    spec:
      containers:
        - name: api
          image: lecture-10-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5010
          env:
            - name: OTEL_SERVICE_NAME
              value: lecture-10-api
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability.svc.cluster.local:4317
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: LOG_TO_FILE
              value: "false"
            - name: DEMO_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: lecture-10-api-keys
                  key: admin-key
            - name: DEMO_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: lecture-10-api-keys
                  key: service-key
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

